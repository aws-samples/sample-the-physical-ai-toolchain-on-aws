apiVersion: v1
kind: Service
metadata:
  name: {{ include "cosmos3.fullname" . }}
  labels:
    {{- include "cosmos3.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cosmos3.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
