# Cosmos3 V2V generation as a self-contained Kubernetes Job.
#
# Unlike the earlier version of this manifest (server-only, generation driven
# by an external kubectl port-forward + curl), this Job runs the FULL
# pipeline inside the container and exits when done:
#   1. Start the vLLM-Omni Cosmos3 server in the background (Super or Nano,
#      see COSMOS_MODEL below)
#   2. Wait for /v1/models to report ready
#   3. Download the reference video from S3 (via the pod's IRSA credentials)
#   4. Submit an async /v1/videos job, poll until completed, download the
#      result from /v1/videos/{id}/content (not /v1/videos/sync — it has a
#      hardcoded ~600s server-side abort that full-length generations,
#      especially on Nano, can exceed)
#   5. Upload the result (+ the original reference) to S3
#   6. Exit — the Job reports Completed, Cluster Autoscaler scales the GPU
#      node back down once it's idle past scale-down-unneeded-time
#
# Configure via the env vars below (INPUT_S3_URI, OUTPUT_S3_PREFIX, PROMPT,
# SEED) instead of editing the script.
#
# BEFORE APPLYING: replace <DATASETS_BUCKET> and <REGION> below with your own
# values (see eks-deployment-guide.md Step 5). <DATASETS_BUCKET> is the
# Foundation stack's datasets bucket name — get it with:
#   terraform -chdir=foundation/infra output -raw datasets_bucket_name
#
# MODEL CHOICE (Super vs Nano): set COSMOS_MODEL below to "super" or "nano".
# Super (64B) needs all 8 GPUs on a p5.48xlarge; Nano (16B) needs only 1 GPU
# and can run on a much smaller/cheaper node. If you switch to "nano", also
# update `resources.requests`/`resources.limits` (nvidia.com/gpu) below to
# "1" and size the GPU node group accordingly (see eks-deployment-guide.md
# "Choosing Super vs Nano"). Nano's node group doesn't need a Capacity Block
# — it fits on commonly-available single-GPU instance types (e.g. g6e.xlarge).
apiVersion: batch/v1
kind: Job
metadata:
  name: cosmos3-vllm-omni
  namespace: default
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  # Give the Job enough time for model load (~15-20 min first time, Nano
  # ~33GB is faster than Super's ~126GB) + generation (Super ~2-8 min, Nano
  # ~10-12 min on 1 GPU) + upload.
  activeDeadlineSeconds: 2700
  template:
    metadata:
      labels:
        app: cosmos3-vllm-omni
    spec:
      serviceAccountName: cosmos3-generator
      restartPolicy: Never
      nodeSelector:
        node.kubernetes.io/purpose: gpu
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: vllm-omni
          image: vllm/vllm-omni:cosmos3
          imagePullPolicy: IfNotPresent
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              # /models is the node-local hostPath (see volumes below); HF_HOME points
              # into it so a cached download survives pod restarts.
              mkdir -p /models/hf-cache /workspace/io

              # --- Resolve model + serve flags from COSMOS_MODEL ---
              case "${COSMOS_MODEL}" in
                super)
                  MODEL_ID="nvidia/Cosmos3-Super"
                  SERVE_ARGS="--cfg-parallel-size 2 --ulysses-degree 4 --use-hsdp --hsdp-shard-size 8"
                  ;;
                nano)
                  MODEL_ID="nvidia/Cosmos3-Nano"
                  LOCAL_MODEL_DIR="/models/cosmos3-nano"
                  # --vae-use-tiling is required on single-GPU nodes (e.g.
                  # g6e.4xlarge, ~44GB usable VRAM) — without it, VAE decode
                  # OOMs at the default 189-frame/720p generation size.
                  # Measured on an L40S: peak 43.5 GB of 46 GB even WITH tiling,
                  # so 48 GB is the practical floor for this model.
                  SERVE_ARGS="--vae-use-tiling"
                  ;;
                *)
                  echo "ERROR: Unknown COSMOS_MODEL '${COSMOS_MODEL}' (expected 'super' or 'nano')" >&2
                  exit 1
                  ;;
              esac

              # --- Prefer node-local staged weights over a gated HF download ---
              # event-provision.sh stages weights onto the node's disk (hostPath
              # /opt/cosmos3, mounted here at /models). Serving straight from that
              # directory skips the ~33 GB gated Hugging Face download, so participants
              # need neither an HF token nor an accepted model licence.
              #
              # Falling back to the Hugging Face repo id keeps the path that is actually
              # validated end-to-end (measured on g6e.4xlarge: 7m44s to ready, 11m22s to
              # generate) working unchanged when nothing has been staged.
              if [ -n "${LOCAL_MODEL_DIR:-}" ] && [ -d "$LOCAL_MODEL_DIR" ] \
                 && [ -n "$(ls -A "$LOCAL_MODEL_DIR" 2>/dev/null)" ]; then
                echo "=== Using node-local staged weights: $LOCAL_MODEL_DIR ==="
                MODEL_ID="$LOCAL_MODEL_DIR"
              elif [ "${REQUIRE_LOCAL_WEIGHTS:-false}" = "true" ]; then
                echo "ERROR: staged Cosmos weights are required at ${LOCAL_MODEL_DIR:-<unset>}; Hugging Face fallback is disabled" >&2
                exit 1
              else
                echo "=== No staged weights at ${LOCAL_MODEL_DIR:-<unset>} - falling back to Hugging Face (${MODEL_ID}) ==="
              fi

              # Derived AFTER the override on purpose: /v1/models reports whatever was
              # passed to `vllm serve`, so deriving this from the Hugging Face id would
              # make the readiness grep below never match a local-path launch.
              MODEL_SHORT_NAME=$(basename "$MODEL_ID")

              # --- Ensure the AWS CLI is available (image doesn't ship it) ---
              # Installed via pip instead of the official zip installer — the
              # image has python3/pip3 but not `unzip`, which the zip
              # installer requires. pip's awscli is pure-Python, no unzip
              # needed, and is fast enough here (a few seconds).
              if ! command -v aws >/dev/null 2>&1; then
                echo "=== Installing AWS CLI (via pip) ==="
                pip3 install --quiet awscli
              fi

              # --- Start the server in the background ---
              echo "=== Starting vLLM-Omni ${MODEL_ID} ==="
              vllm serve "$MODEL_ID" --omni $SERVE_ARGS \
                --init-timeout 2400 --stage-init-timeout 1800 \
                --host 0.0.0.0 --port 8000 &
              SERVER_PID=$!

              # --- Wait for readiness ---
              echo "=== Waiting for server readiness (can take ~15-20 min on first weight download) ==="
              for i in $(seq 1 90); do
                if curl -sf -m 5 http://localhost:8000/v1/models | grep -q "$MODEL_SHORT_NAME"; then
                  echo "Server ready after ${i} checks."
                  break
                fi
                if ! kill -0 "$SERVER_PID" 2>/dev/null; then
                  echo "ERROR: server process died during startup." >&2
                  exit 1
                fi
                sleep 20
              done

              if ! curl -sf -m 5 http://localhost:8000/v1/models | grep -q "$MODEL_SHORT_NAME"; then
                echo "ERROR: server did not become ready in time." >&2
                exit 1
              fi

              # --- Download the reference video from S3 ---
              REF_LOCAL=/workspace/io/reference.mp4
              echo "=== Downloading reference video: ${INPUT_S3_URI} ==="
              aws s3 cp "${INPUT_S3_URI}" "$REF_LOCAL" --region "${AWS_REGION}"

              # --- Generate ---
              # Uses the ASYNC job API (POST /v1/videos + poll + /content),
              # not /v1/videos/sync. /v1/videos/sync has a hardcoded
              # server-side abort at ~600s regardless of client --max-time —
              # confirmed hitting this on Nano (single GPU, full
              # 189-frame/720p generation takes ~10-12 min). Super usually
              # finishes under 600s but async is used uniformly since it's
              # the robust path for either model.
              OUT_LOCAL=/workspace/io/output.mp4
              echo "=== Generating V2V (prompt below) ==="
              echo "${PROMPT}"
              CREATE_RESPONSE=$(curl -sS -X POST http://localhost:8000/v1/videos \
                -H "Accept: application/json" \
                -F "model=${MODEL_ID}" \
                -F "prompt=${PROMPT}" \
                -F "size=1280x720" \
                -F "num_frames=189" \
                -F "fps=24" \
                -F "num_inference_steps=35" \
                -F "guidance_scale=6.0" \
                -F "max_sequence_length=4096" \
                -F "flow_shift=10.0" \
                -F "extra_params={\"condition_frame_indexes_vision\":[0,1],\"condition_video_keep\":\"first\"}" \
                -F "seed=${SEED}" \
                -F "input_reference=@${REF_LOCAL};type=video/mp4")
              VIDEO_ID=$(echo "$CREATE_RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
              echo "Job submitted: $VIDEO_ID"

              echo "Polling for completion..."
              GEN_STATUS="unknown"
              for i in $(seq 1 90); do
                STATUS_JSON=$(curl -sf -m 10 "http://localhost:8000/v1/videos/${VIDEO_ID}")
                GEN_STATUS=$(echo "$STATUS_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','unknown'))")
                echo "  [${i}] status=${GEN_STATUS}"
                if [ "$GEN_STATUS" = "completed" ]; then
                  break
                fi
                if [ "$GEN_STATUS" = "failed" ] || [ "$GEN_STATUS" = "cancelled" ]; then
                  echo "ERROR: job ${GEN_STATUS}: ${STATUS_JSON}" >&2
                  exit 1
                fi
                sleep 10
              done
              if [ "$GEN_STATUS" != "completed" ]; then
                echo "ERROR: job did not complete in time (last status: ${GEN_STATUS})." >&2
                exit 1
              fi

              curl -sS -L "http://localhost:8000/v1/videos/${VIDEO_ID}/content" -o "$OUT_LOCAL"
              ls -lh "$OUT_LOCAL"

              # --- Upload result (+ original reference) to S3 ---
              echo "=== Uploading to ${OUTPUT_S3_PREFIX} ==="
              aws s3 cp "$OUT_LOCAL" "${OUTPUT_S3_PREFIX}/${OUTPUT_FILENAME}" --region "${AWS_REGION}"
              aws s3 cp "$REF_LOCAL" "${OUTPUT_S3_PREFIX}/${REFERENCE_FILENAME}" --region "${AWS_REGION}"

              echo "=== Done. Shutting down server. ==="
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
              echo "Job complete."
          env:
            # On the node's disk, not the pod's emptyDir: an emptyDir is destroyed with
            # the pod, so a retried or second run would re-download the full ~33 GB.
            - { name: HF_HOME, value: "/models/hf-cache" }
            - name: HF_TOKEN
              valueFrom:
                # optional: the pod must still start when the Secret is absent and the
                # model is served from staged node-local weights. Without this flag a
                # missing Secret wedges the pod in CreateContainerConfigError.
                secretKeyRef: { name: hf-token, key: token, optional: true }
            # "super" (64B, 8 GPUs) or "nano" (16B, 1 GPU) — see the note at
            # the top of this file. Must be kept in sync with
            # resources.requests/limits below.
            - { name: COSMOS_MODEL, value: "super" }
            # Set true in event manifests after central weight staging is configured.
            - { name: REQUIRE_LOCAL_WEIGHTS, value: "false" }
            # <REGION> and <DATASETS_BUCKET> are account-specific — replace
            # both before applying (see note at the top of this file).
            - { name: AWS_REGION, value: "<REGION>" }
            - { name: INPUT_S3_URI, value: "s3://<DATASETS_BUCKET>/groot-data/ur3/dataset/videos/chunk-000/observation.images.wrist/episode_000000.mp4" }
            - { name: OUTPUT_S3_PREFIX, value: "s3://<DATASETS_BUCKET>/cosmos-samples" }
            - { name: OUTPUT_FILENAME, value: "augmented_episode_000000_eks_selfcontained.mp4" }
            - { name: REFERENCE_FILENAME, value: "original_episode_000000_eks_selfcontained.mp4" }
            - { name: SEED, value: "100" }
            - name: PROMPT
              value: >-
                A UR3 robot arm with a Robotiq gripper reaches down to a dark matte
                table, grasps a small red wooden block, lifts it slowly, and places
                it onto a yellow sticky note approximately 6 inches away. Top-down
                wrist camera view. Colorful wooden blocks are scattered on the table.
                Smooth deliberate motion.
          # GPU count must match COSMOS_MODEL above: "super" needs 8, "nano"
          # needs 1. If you switch to nano, also change nodeSelector/
          # tolerations below to target a single-GPU node group instead of
          # the p5.48xlarge GPU node group.
          resources:
            requests:
              nvidia.com/gpu: "8"
            limits:
              nvidia.com/gpu: "8"
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: shm, mountPath: /dev/shm }
            # Node-local weight staging area. Without this mount the staged weights
            # written by event-provision.sh are invisible to the pod and every run
            # re-downloads ~33 GB from Hugging Face.
            - { name: models, mountPath: /models }
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 400Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        # hostPath rather than a PVC: eks.tf builds the cluster in the Foundation VPC
        # and installs only aws-ebs-csi-driver (no EFS), and the GPU node group is a
        # single node, so node-local disk is both sufficient and the fastest option.
        # DirectoryOrCreate keeps the pod schedulable on a node that was never staged,
        # in which case the Hugging Face fallback above takes over.
        - name: models
          hostPath:
            path: /opt/cosmos3
            type: DirectoryOrCreate
