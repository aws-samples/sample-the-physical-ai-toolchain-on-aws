version: 0.2

# Builds the GR00T inference/serving container in CodeBuild and pushes it to ECR.
# Base image is an AWS PyTorch Deep Learning Container (ECR account 763104351884);
# CodeBuild authenticates to that account in pre_build.
#
# Env vars provided by the ContainerBuild construct:
#   ECR_REPO_URI        - full ECR repo URI (…/physical-ai/gr00t-inference)
#   AWS_DEFAULT_REGION  - build region

phases:
  pre_build:
    commands:
      - echo "Build started on $(date)"
      - REGISTRY=$(echo "$ECR_REPO_URI" | cut -d/ -f1)
      - echo "Logging in to target ECR registry $REGISTRY..."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - echo "Logging in to the AWS DLC ECR account (763104351884)..."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin 763104351884.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  build:
    commands:
      - echo "Building gr00t-inference image..."
      - cd containers/gr00t-inference
      - docker build --platform linux/amd64 --build-arg DLC_REGION=$AWS_DEFAULT_REGION -t gr00t-inference .
      - docker tag gr00t-inference:latest "$ECR_REPO_URI:latest"
  post_build:
    commands:
      - echo "Pushing to ECR..."
      - docker push "$ECR_REPO_URI:latest"
      - 'echo "Done. Image: $ECR_REPO_URI:latest"'
