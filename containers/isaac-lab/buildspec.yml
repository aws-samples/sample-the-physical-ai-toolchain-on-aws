version: 0.2

# Builds the Isaac Lab 3 G1 training container in CodeBuild and pushes it to ECR.
# The base image is from NVIDIA NGC, so an NGC API key is required.
#
# Environment variables provided by the ContainerBuild construct:
#   ECR_REPO_URI        - full ECR repository URI (…/physical-ai/isaac-lab)
#   AWS_DEFAULT_REGION  - build region
#   NGC_SECRET_NAME     - Secrets Manager secret holding the NGC API key

phases:
  pre_build:
    commands:
      - echo "Build started on $(date)"
      - REGISTRY=$(echo "$ECR_REPO_URI" | cut -d/ -f1)
      - echo "Logging in to ECR registry $REGISTRY..."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - echo "Logging in to NGC (nvcr.io)..."
      - NGC_API_KEY=$(aws secretsmanager get-secret-value --secret-id "$NGC_SECRET_NAME" --region "$AWS_DEFAULT_REGION" --query SecretString --output text)
      - echo "$NGC_API_KEY" | docker login nvcr.io --username '$oauthtoken' --password-stdin
  build:
    commands:
      - echo "Building Isaac Lab 3.0.0-beta2 G1 image..."
      # Dockerfile COPYs paths relative to the repository root.
      - docker build --platform linux/amd64 -t isaac-lab-training:3.0.0-beta2-g1 -f containers/isaac-lab/Dockerfile .
      - docker tag isaac-lab-training:3.0.0-beta2-g1 "$ECR_REPO_URI:3.0.0-beta2-g1"
      - docker tag isaac-lab-training:3.0.0-beta2-g1 "$ECR_REPO_URI:latest"
  post_build:
    commands:
      - echo "Pushing versioned and convenience tags to ECR..."
      - docker push "$ECR_REPO_URI:3.0.0-beta2-g1"
      - docker push "$ECR_REPO_URI:latest"
      - 'echo "Done. Image: $ECR_REPO_URI:3.0.0-beta2-g1"'
